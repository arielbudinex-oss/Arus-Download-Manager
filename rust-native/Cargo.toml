[package]
name = "arus-native"
version = "1.0.2"
edition = "2021"
build = "build.rs"
description = "Arus native download manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "process", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
bytes = "1"
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "gzip", "brotli", "json"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
regex = "1"
percent-encoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
quick-xml = "0.37"
parking_lot = "0.12"
mime_guess = "2"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
