<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#090b0e">
<meta name="color-scheme" content="dark">
<title>Laporan bug · Arus</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="styles.css">
<style>
  body { min-height: 100vh; }
  .admin-wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .admin-brand { display: flex; align-items: center; gap: 12px; }
  .admin-brand img { width: 30px; height: 30px; border-radius: 8px; }
  .admin-brand strong { font-size: 18px; letter-spacing: -0.02em; }
  .admin-brand span { color: var(--faint); font-size: 13px; }
  .gate { max-width: 420px; margin: 12vh auto 0; padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .gate h1 { font-size: 21px; margin-bottom: 6px; letter-spacing: -0.02em; }
  .gate p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .gate label { display: block; font-size: 12px; color: var(--faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .gate input { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg-soft); outline: none; }
  .gate input:focus { border-color: var(--accent); }
  .gate button { width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #090b0e; font-weight: 650; }
  .gate .gate-note { margin-top: 12px; font-size: 12px; color: var(--faint); margin-bottom: 0; }
  .admin-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .admin-bar .count { font-size: 13px; color: var(--muted); margin-right: auto; }
  .admin-btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; }
  .admin-btn:hover { background: var(--surface-2); }
  .admin-btn[disabled] { opacity: 0.5; cursor: default; }
  .admin-search { height: 36px; width: min(260px, 100%); padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-soft); font-size: 13px; outline: none; }
  .admin-search:focus { border-color: var(--line-strong); }
  .rep-list { display: grid; gap: 14px; }
  .rep { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 18px 18px 14px; }
  .rep-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 10px; }
  .rep-top strong { font-size: 15px; }
  .rep-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--faint); }
  .rep-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .rep-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
  .rep-msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; color: var(--text); margin-bottom: 10px; }
  .rep-contact { font-size: 13px; color: var(--muted); margin-bottom: 10px; overflow-wrap: anywhere; }
  .rep details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .rep summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .rep pre { margin: 10px 0 0; padding: 12px; border-radius: 10px; background: var(--bg-soft); border: 1px solid var(--line); font-size: 11.5px; line-height: 1.55; overflow: auto; max-height: 320px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rep-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rep-actions button { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--muted); }
  .rep-actions button:hover { color: var(--text); border-color: var(--line-strong); }
  .empty { padding: 40px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: 16px; color: var(--muted); font-size: 14px; }
  .admin-msg { min-height: 18px; font-size: 12.5px; color: var(--faint); margin-top: 10px; }
  .admin-msg.is-error { color: #f2b8b8; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--line); font-size: 11px; color: var(--accent); }
  .admin-actions { display: flex; align-items: center; gap: 10px; }
  .admin-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 8px; }
  .admin-stat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
  .admin-stat span { font-size: 12px; color: var(--faint); }
  .admin-stat strong { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .admin-stats-note { margin: 0 0 16px; font-size: 12px; color: var(--faint); }
  @media (max-width: 560px) {
    .admin-wrap { padding: 24px 16px 60px; }
    .gate { margin-top: 6vh; padding: 20px; }
    .admin-stats { gap: 8px; }
    .admin-stat { padding: 12px; }
    .admin-stat strong { font-size: 19px; }
  }
</style>
</head>
<body>
<main class="admin-wrap">
  <header class="admin-head">
    <div class="admin-brand">
      <img src="assets/icon.png" alt="" width="30" height="30">
      <div><strong>Arus</strong><br><span data-i18n="header.subtitle">Laporan bug</span></div>
    </div>
    <div class="admin-actions">
      <div class="lang-switch" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang-value="id" class="is-active" aria-pressed="true">ID</button>
        <button type="button" data-lang-value="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="admin-btn" id="lock-btn" hidden data-i18n="lock">Kunci lagi</button>
    </div>
  </header>

  <section class="gate" id="gate" aria-labelledby="gate-title">
    <h1 id="gate-title" data-i18n="gate.title">Masuk ke laporan</h1>
    <p data-i18n="gate.body">Halaman ini hanya untuk pemilik Arus. Kunci disimpan di tab ini dan hilang saat tab ditutup.</p>
    <form id="gate-form">
      <label for="gate-key" data-i18n="gate.label">Kunci akses</label>
      <input id="gate-key" type="password" autocomplete="current-password" spellcheck="false" required>
      <button type="submit" id="gate-submit" data-i18n="gate.submit">Buka laporan</button>
    </form>
    <p class="gate-note" data-i18n="gate.note">Kunci diatur lewat env REPORTS_KEY di Vercel.</p>
    <p class="admin-msg" id="gate-msg" role="status"></p>
  </section>

  <section id="dash" hidden>
    <div class="admin-stats">
      <div class="admin-stat"><span data-i18n="stats.downloads">Unduhan</span><strong id="stat-downloads">—</strong></div>
      <div class="admin-stat"><span data-i18n="stats.stars">Bintang</span><strong id="stat-stars">—</strong></div>
      <div class="admin-stat"><span data-i18n="stats.forks">Fork</span><strong id="stat-forks">—</strong></div>
    </div>
    <p class="admin-stats-note" id="stats-note">Mengambil statistik…</p>
    <div class="admin-bar">
      <span class="count" id="rep-count">0 laporan</span>
      <input class="admin-search" id="rep-search" type="search" placeholder="Cari isi laporan atau versi" aria-label="Cari laporan">
      <button type="button" class="admin-btn" id="rep-refresh" data-i18n="reload">Muat ulang</button>
      <button type="button" class="admin-btn" id="rep-copy-all" data-i18n="copy.all">Salin semua</button>
    </div>
    <p class="admin-msg" id="rep-msg" role="status"></p>
    <div class="rep-list" id="rep-list"></div>
  </section>
</main>

<script>
(() => {
  const KEY_STORE = 'arus.reports.key';
  const LANG_KEY = 'arus.site.lang';
  const REFRESH_MS = 60 * 1000;
  const state = { key: '', reports: [], filter: '', busy: false, loaded: false, lang: 'id', stats: null, statsAt: 0, statsFailed: false };
  const $ = (s) => document.querySelector(s);
  const gate = $('#gate');
  const dash = $('#dash');
  const gateMsg = $('#gate-msg');
  const repMsg = $('#rep-msg');
  const list = $('#rep-list');
  const count = $('#rep-count');
  const lockBtn = $('#lock-btn');

  const TEXT = {
    id: {
      'doc.title': 'Laporan bug · Arus',
      'header.subtitle': 'Laporan bug',
      lock: 'Kunci lagi',
      'gate.title': 'Masuk ke laporan',
      'gate.body': 'Halaman ini hanya untuk pemilik Arus. Kunci disimpan di tab ini dan hilang saat tab ditutup.',
      'gate.label': 'Kunci akses',
      'gate.submit': 'Buka laporan',
      'gate.note': 'Kunci diatur lewat env REPORTS_KEY di Vercel.',
      'stats.downloads': 'Unduhan',
      'stats.stars': 'Bintang',
      'stats.forks': 'Fork',
      'search.placeholder': 'Cari isi laporan atau versi',
      'search.label': 'Cari laporan',
      reload: 'Muat ulang',
      'copy.all': 'Salin semua',
      'count.initial': '0 laporan',
      'count.range': '{shown} dari {total} laporan',
      loading: 'Mengambil laporan…',
      'loading.more': 'Menampilkan 30 laporan terbaru. Masih ada laporan lama.',
      'key.wrong': 'Kunci akses salah.',
      'load.failed': 'Gagal memuat ({status})',
      'copy.done': 'Semua laporan tersalin.',
      'copy.blocked': 'Clipboard tidak tersedia.',
      'empty.filter': 'Tidak ada yang cocok dengan pencarian.',
      'empty.none': 'Belum ada laporan masuk.',
      empty: '(kosong)',
      contact: 'Kontak: {value}',
      diagnostics: 'Diagnostik',
      logs: 'Log terakhir ({count})',
      'logs.one': '1 log',
      'logs.count': '{count} log',
      'copy.json': 'Salin JSON',
      copied: 'Tersalin',
      'date.none': 'tanpa tanggal',
      'stats.updated': 'Diperbarui {time}',
      'stats.pending': 'Mengambil statistik…',
      'stats.failed': 'Statistik belum bisa dimuat. Mencoba lagi sebentar lagi.',
      locale: 'id-ID'
    },
    en: {
      'doc.title': 'Bug reports · Arus',
      'header.subtitle': 'Bug reports',
      lock: 'Lock again',
      'gate.title': 'Open the reports',
      'gate.body': 'This page is only for the Arus owner. The key stays in this tab and is cleared when the tab closes.',
      'gate.label': 'Access key',
      'gate.submit': 'Open reports',
      'gate.note': 'The key is set through the REPORTS_KEY env in Vercel.',
      'stats.downloads': 'Downloads',
      'stats.stars': 'Stars',
      'stats.forks': 'Forks',
      'search.placeholder': 'Search message or version',
      'search.label': 'Search reports',
      reload: 'Reload',
      'copy.all': 'Copy all',
      'count.initial': '0 reports',
      'count.range': '{shown} of {total} reports',
      loading: 'Loading reports…',
      'loading.more': 'Showing the latest 30 reports. Older reports exist.',
      'key.wrong': 'Wrong access key.',
      'load.failed': 'Could not load ({status})',
      'copy.done': 'All reports copied.',
      'copy.blocked': 'Clipboard is unavailable.',
      'empty.filter': 'Nothing matches your search.',
      'empty.none': 'No reports yet.',
      empty: '(empty)',
      contact: 'Contact: {value}',
      diagnostics: 'Diagnostics',
      logs: 'Recent logs ({count})',
      'logs.one': '1 log',
      'logs.count': '{count} logs',
      'copy.json': 'Copy JSON',
      copied: 'Copied',
      'date.none': 'no date',
      'stats.updated': 'Updated {time}',
      'stats.pending': 'Loading stats…',
      'stats.failed': 'Stats could not load. Retrying shortly.',
      locale: 'en-US'
    }
  };

  function t(key, vars) {
    let text = TEXT[state.lang] && TEXT[state.lang][key] !== undefined ? TEXT[state.lang][key] : TEXT.id[key];
    if (text === undefined) return key;
    if (vars) {
      Object.keys(vars).forEach((name) => { text = text.split('{' + name + '}').join(String(vars[name])); });
    }
    return text;
  }

  function setMsg(el, text, error) {
    el.textContent = text || '';
    el.classList.toggle('is-error', Boolean(error));
  }

  function readKey() {
    try { return sessionStorage.getItem(KEY_STORE) || ''; } catch { return ''; }
  }
  function writeKey(value) {
    try {
      if (value) sessionStorage.setItem(KEY_STORE, value);
      else sessionStorage.removeItem(KEY_STORE);
    } catch { /* private mode */ }
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function formatDate(iso) {
    if (!iso) return t('date.none');
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return iso;
    return date.toLocaleString(t('locale'), { dateStyle: 'medium', timeStyle: 'short' });
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString(t('locale'));
  }

  function renderStats() {
    const data = state.stats;
    $('#stat-downloads').textContent = data && typeof data.downloads === 'number' ? formatNumber(data.downloads) : '—';
    $('#stat-stars').textContent = data && typeof data.stars === 'number' ? formatNumber(data.stars) : '—';
    $('#stat-forks').textContent = data && typeof data.forks === 'number' ? formatNumber(data.forks) : '—';
    $('#stats-note').textContent = state.statsAt
      ? t('stats.updated', { time: new Date(state.statsAt).toLocaleTimeString(t('locale'), { hour: '2-digit', minute: '2-digit' }) })
      : t(state.statsFailed ? 'stats.failed' : 'stats.pending');
  }

  async function loadStats() {
    try {
      const response = await fetch('/api/stats', { headers: { Accept: 'application/json' }, cache: 'no-store' });
      if (!response.ok) throw new Error('stats');
      const data = await response.json();
      if (!data || typeof data.downloads !== 'number') throw new Error('stats');
      state.stats = data;
      state.statsAt = Date.now();
      state.statsFailed = false;
    } catch {
      state.statsFailed = true;
    }
    renderStats();
  }

  function render() {
    list.textContent = '';
    const filter = state.filter.trim().toLowerCase();
    const reports = state.reports.filter((report) => {
      if (!filter) return true;
      const haystack = `${report.message || ''} ${report.contact || ''} ${report.app?.version || ''} ${report.id || ''}`.toLowerCase();
      return haystack.includes(filter);
    });
    if (state.loaded) count.textContent = t('count.range', { shown: reports.length, total: state.reports.length });
    if (!reports.length) {
      list.appendChild(el('div', 'empty', state.reports.length ? t('empty.filter') : t('empty.none')));
      return;
    }
    for (const report of reports) {
      const card = el('article', 'rep');
      const top = el('div', 'rep-top');
      top.appendChild(el('strong', '', report.app?.version ? `Arus ${report.app.version}` : 'Arus'));
      const meta = el('div', 'rep-meta');
      meta.appendChild(el('span', '', formatDate(report.createdAt)));
      if (report.app?.build) {
        const dot = el('i', 'dot'); dot.setAttribute('aria-hidden', 'true');
        meta.appendChild(dot);
        meta.appendChild(el('span', '', `build ${report.app.build}`));
      }
      if (report.request?.country) {
        meta.appendChild(el('i', 'dot'));
        meta.appendChild(el('span', '', report.request.country));
      }
      if (Array.isArray(report.logs) && report.logs.length) {
        meta.appendChild(el('i', 'dot'));
        meta.appendChild(el('span', '', report.logs.length === 1 ? t('logs.one') : t('logs.count', { count: report.logs.length })));
      }
      top.appendChild(meta);
      card.appendChild(top);
      card.appendChild(el('p', 'rep-msg', report.message || t('empty')));
      if (report.contact) card.appendChild(el('p', 'rep-contact', t('contact', { value: report.contact })));
      if (report.diagnostics) {
        const details = document.createElement('details');
        details.appendChild(el('summary', '', t('diagnostics')));
        details.appendChild(el('pre', '', JSON.stringify(report.diagnostics, null, 2)));
        card.appendChild(details);
      }
      if (Array.isArray(report.logs) && report.logs.length) {
        const details = document.createElement('details');
        details.appendChild(el('summary', '', t('logs', { count: report.logs.length })));
        const lines = report.logs.map((entry) => `${entry.at || ''} [${entry.level || 'log'}] ${entry.message || ''}`).join('\n');
        details.appendChild(el('pre', '', lines));
        card.appendChild(details);
      }
      const actions = el('div', 'rep-actions');
      const copy = el('button', '', t('copy.json'));
      copy.type = 'button';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(JSON.stringify(report, null, 2));
          copy.textContent = t('copied');
          setTimeout(() => { copy.textContent = t('copy.json'); }, 1600);
        } catch {
          setMsg(repMsg, t('copy.blocked'), true);
        }
      });
      actions.appendChild(copy);
      actions.appendChild(el('span', 'badge', report.id || ''));
      card.appendChild(actions);
      list.appendChild(card);
    }
  }

  async function load() {
    if (!state.key || state.busy) return;
    state.busy = true;
    setMsg(repMsg, t('loading'));
    try {
      const res = await fetch(`/api/reports?limit=100`, {
        headers: { 'x-reports-key': state.key },
        cache: 'no-store'
      });
      const data = await res.json().catch(() => null);
      if (res.status === 401) throw new Error(t('key.wrong'));
      if (!res.ok) throw new Error(data?.error || t('load.failed', { status: res.status }));
      state.reports = Array.isArray(data.reports) ? data.reports : [];
      state.loaded = true;
      setMsg(repMsg, data.hasMore ? t('loading.more') : '');
      render();
      dash.hidden = false;
      gate.hidden = true;
      lockBtn.hidden = false;
      writeKey(state.key);
      loadStats();
    } catch (error) {
      setMsg(state.reports.length ? repMsg : gateMsg, error.message, true);
      if (!state.reports.length) {
        dash.hidden = true;
        gate.hidden = false;
        lockBtn.hidden = true;
        state.key = '';
        writeKey('');
      }
    } finally {
      state.busy = false;
    }
  }

  function applyLang() {
    document.documentElement.lang = state.lang;
    document.title = t('doc.title');
    document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = t(node.dataset.i18n); });
    const search = $('#rep-search');
    search.placeholder = t('search.placeholder');
    search.setAttribute('aria-label', t('search.label'));
    document.querySelectorAll('[data-lang-value]').forEach((button) => {
      const active = button.dataset.langValue === state.lang;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    setMsg(repMsg, '');
    setMsg(gateMsg, '');
    if (!state.loaded) count.textContent = t('count.initial');
    render();
    renderStats();
  }

  function setLang(value) {
    state.lang = value === 'en' ? 'en' : 'id';
    try { localStorage.setItem(LANG_KEY, state.lang); } catch { /* private mode */ }
    applyLang();
  }

  $('#gate-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const value = $('#gate-key').value.trim();
    if (!value) return;
    state.key = value;
    setMsg(gateMsg, '');
    load();
  });

  $('#rep-refresh').addEventListener('click', () => load());

  $('#rep-search').addEventListener('input', (event) => {
    state.filter = event.target.value;
    render();
  });

  $('#rep-copy-all').addEventListener('click', async () => {
    if (!state.reports.length) return;
    try {
      await navigator.clipboard.writeText(JSON.stringify(state.reports, null, 2));
      setMsg(repMsg, t('copy.done'));
    } catch {
      setMsg(repMsg, t('copy.blocked'), true);
    }
  });

  document.querySelectorAll('[data-lang-value]').forEach((button) => {
    button.addEventListener('click', () => setLang(button.dataset.langValue));
  });

  lockBtn.addEventListener('click', () => {
    state.key = '';
    state.reports = [];
    state.loaded = false;
    writeKey('');
    gate.hidden = false;
    dash.hidden = true;
    lockBtn.hidden = true;
    list.textContent = '';
    count.textContent = t('count.initial');
    $('#gate-key').value = '';
    setMsg(repMsg, '');
    setMsg(gateMsg, '');
    $('#gate-key').focus();
  });

  window.setInterval(() => {
    if (document.visibilityState === 'visible' && !dash.hidden) loadStats();
  }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !dash.hidden) loadStats();
  });

  let savedLang = 'id';
  try { savedLang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'id'; } catch { /* private mode */ }
  state.lang = savedLang;
  applyLang();

  const saved = readKey();
  if (saved) {
    state.key = saved;
    gate.hidden = true;
    lockBtn.hidden = false;
    load();
  } else {
    $('#gate-key').focus();
  }
})();
</script>
</body>
</html>
